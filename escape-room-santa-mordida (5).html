<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arquivo Santa Mordida — Escape Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0b09;--y:#f5c42c;--y2:#ffd95e;--paper:#efe4c9;--ink:#1d1a15;--red:#d11f1f;--ok:#4cc265;--muted:#a59b86}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:#f3ecdc;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
body{min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hidden{display:none!important}
.cond,h1,h2,h3{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em;line-height:1.02}
.tape{height:12px;background:repeating-linear-gradient(-45deg,var(--y) 0 14px,#111 14px 28px)}
.kicker{font-family:Oswald;color:var(--y);letter-spacing:.18em;text-transform:uppercase;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--y);color:#111;font-family:Oswald;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:19px;padding:14px 28px;border-radius:6px;box-shadow:0 5px 0 #a6820f;transition:transform .12s;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a6820f}
.btn.ghost{background:transparent;color:var(--y);border:2px solid var(--y);box-shadow:none}
.pulse{animation:btnpulse 1.4s ease-in-out infinite}
@keyframes btnpulse{50%{box-shadow:0 5px 0 #a6820f,0 0 0 8px rgba(245,196,44,.18)}}

/* ---------- HUD ---------- */
.hud{position:fixed;top:0;left:0;right:0;z-index:30;background:rgba(12,11,9,.88);backdrop-filter:blur(6px)}
.hud-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px;height:50px}
.hud-brand{font-family:Oswald;font-weight:700;font-size:13px;line-height:1;text-transform:uppercase}
.hud-brand small{display:block;color:var(--y);font-size:10px;letter-spacing:.14em;margin-top:2px}
.dots{flex:1;display:flex;justify-content:center;gap:6px}
.dots i{width:24px;height:24px;border-radius:50%;border:2px solid #4a4335;display:grid;place-items:center;font:700 11px Oswald;color:#7c7260;font-style:normal;transition:.3s}
.dots i.on{border-color:var(--y);color:var(--y);box-shadow:0 0 10px rgba(245,196,44,.5)}
.dots i.ok{background:var(--y);border-color:var(--y);color:#111}
.timer{font:700 24px Oswald;font-variant-numeric:tabular-nums;min-width:66px;text-align:right;position:relative}
.timer.warn{color:var(--y)}.timer.over{color:#ff6b5e}
.snd{font-size:18px;opacity:.8;width:30px}
.pen{position:absolute;right:0;top:26px;color:#ff6b5e;font:700 16px Oswald;animation:penfloat 1s ease-out forwards;pointer-events:none}
@keyframes penfloat{to{transform:translateY(22px);opacity:0}}

/* ---------- Telas ---------- */
.screen{min-height:100dvh;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:66px 14px 24px}
.bg{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:brightness(.28) blur(3px);z-index:0}
.screen>*:not(.bg){position:relative;z-index:1}
.fade{animation:fadein .45s ease}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}}

/* Intro */
.intro{justify-content:center;text-align:center;padding-top:30px}
.intro .bg{filter:brightness(.38);inset:0}
.intro .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,11,9,.2),rgba(12,11,9,.92) 75%)}
.sign{display:inline-block;background:var(--y);color:#111;padding:6px 18px 4px;transform:rotate(-2deg);font:700 clamp(34px,8vw,64px)/1 Oswald;text-transform:uppercase;box-shadow:0 8px 24px rgba(0,0,0,.5);clip-path:polygon(1% 4%,99% 0,100% 92%,0 100%)}
.intro .tagline{font:500 clamp(18px,3.4vw,24px) Oswald;text-transform:uppercase;letter-spacing:.06em;margin:22px 0 6px}
.intro .tagline b{color:var(--y)}
.intro .victims{display:flex;justify-content:center;gap:4px;margin:26px 0 20px}
.intro .victims .chr{width:min(26vw,120px)}
.intro .meta{color:var(--muted);font-size:13px;margin-top:14px;letter-spacing:.06em;text-transform:uppercase}

/* Personagens */
.chr{display:block;width:100%;height:auto;overflow:visible}
.bob{animation:bob 2.6s ease-in-out infinite}
.bob.d1{animation-delay:-.8s}.bob.d2{animation-delay:-1.6s}.bob.d3{animation-delay:-2.1s}
@keyframes bob{50%{transform:translateY(-5px) rotate(-1.5deg)}}
.mouth{transform-box:fill-box;transform-origin:center}
.talk .mouth{animation:yap .14s ease-in-out infinite alternate}
@keyframes yap{to{transform:scaleY(.35)}}
.who{position:relative;text-align:center;user-select:none;-webkit-user-select:none}
.bubble{position:absolute;bottom:calc(100% - 6px);left:50%;transform:translateX(-50%);background:#fff;color:#111;font:700 12.5px/1.25 Inter;padding:7px 10px;border-radius:12px;width:max-content;max-width:150px;box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:5;animation:pop .35s cubic-bezier(.3,1.6,.5,1) both;pointer-events:none}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#fff}
.bubble.bl{left:0;transform:none}.bubble.bl::after{left:26px}
.bubble.br{left:auto;right:0;transform:none}.bubble.br::after{left:auto;right:20px}
.bubble em{font-style:normal;color:var(--red)}
.bubble.err{background:#ffe1dc}
.bubble.hi{bottom:calc(100% + 30px)}
@media(max-width:520px){.bubble{max-width:112px;font-size:11.5px;padding:6px 8px}.hud-brand{display:none}}
@keyframes pop{from{opacity:0;scale:.5}}
.nm{font:700 12px Oswald;text-transform:uppercase;letter-spacing:.08em;color:#e9dfc8;margin-top:2px}

/* Cabeçalho das salas */
.room-head{text-align:center;max-width:640px;margin-bottom:10px}
.room-head h2{font-size:clamp(24px,5.4vw,36px);margin:4px 0 6px}
.room-head p{color:#d9cfb8;font-size:15px}
.room-head p b{color:var(--y)}
.play{width:100%;max-width:860px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}

/* Cadeado */
.mlock{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.55);border:1px solid #3d362a;border-radius:10px;padding:8px 12px;margin-top:8px}
.mlock .pad{position:relative;padding-top:18px}
.mlock .shk{position:absolute;top:0;left:50%;width:34px;height:28px;margin-left:-17px;border:6px solid #a3a9ae;border-bottom:0;border-radius:17px 17px 0 0;transition:transform .45s cubic-bezier(.5,-0.6,.4,1.6)}
.mlock.open .shk{transform:translate(9px,-8px) rotate(14deg)}
.mlock .pb{background:linear-gradient(#d4d8dc,#7d848a);border-radius:6px;padding:5px;display:flex;gap:3px}
.mlock .pb span{width:22px;height:28px;border-radius:3px;background:linear-gradient(#0e0e0e,#454545 50%,#0e0e0e);color:#f3ecdc;font:700 17px Oswald;display:grid;place-items:center}
.mlock .lbl{font:500 12px Oswald;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);line-height:1.2}
.mlock.open .lbl{color:var(--ok)}

/* arrastar */
.drag{touch-action:none;cursor:grab}
.drag.lifted{opacity:.25}
.drag.sel{outline:3px solid var(--y);outline-offset:4px;border-radius:12px}
.dragghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;filter:drop-shadow(0 14px 16px rgba(0,0,0,.6));transition:none}
.dragghost .bubble{display:none}
.drop.over,.drop.hint-drop{outline:3px dashed var(--y);outline-offset:3px}
.nope{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* Sala 1 */
.pool{display:flex;justify-content:center;gap:clamp(6px,3vw,30px);padding-top:90px;min-height:190px;align-items:flex-end}
.pool .who{width:min(28vw,120px)}
.timeline{position:relative;display:flex;justify-content:center;gap:clamp(10px,3vw,30px);padding-top:16px}
.timeline::before{content:"";position:absolute;left:-14px;right:-14px;top:6px;height:2px;background:#b3261e;transform:rotate(-.6deg)}
.tslot{display:flex;flex-direction:column;align-items:center;gap:6px}
.tslot .frame{width:min(27vw,118px);aspect-ratio:1/1.05;background:#f6f1e6;padding:6px;box-shadow:0 8px 16px rgba(0,0,0,.5);display:grid;place-items:center;position:relative}
.tslot .frame::before{content:"";position:absolute;inset:6px;background:#2a241c;border:2px dashed #5a5040}
.tslot .frame .who{position:relative;width:100%}
.tslot .frame .bubble{display:none}
.tslot .frame .nm{display:none}
.tslot .frame img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block;animation:develop 1s ease-out}
.tslot .frame .cap{position:absolute;z-index:2;bottom:-1px;left:0;right:0;background:#f6f1e6;color:#3a3328;font:700 11px Oswald;text-transform:uppercase;padding-top:3px}
.tslot .frame:has(img){padding:6px 6px 20px}
@keyframes develop{from{filter:brightness(2.4) contrast(.4) blur(3px)}}
.evphoto{background:#f6f1e6;padding:5px 5px 18px;box-shadow:0 5px 12px rgba(0,0,0,.5);transform:rotate(-3deg);position:relative;width:150px}
.evphoto img{display:block;width:100%}
.evphoto span{position:absolute;bottom:2px;left:0;right:0;text-align:center;font:700 10.5px Oswald;text-transform:uppercase;color:#3a3328}
.tslot .time{background:var(--y);color:#111;font:700 20px Oswald;padding:2px 12px;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.tslot .num{font:700 15px Oswald;color:var(--y);min-height:20px;letter-spacing:.06em}
.tslot .num b{font-size:22px}

/* Sala 2 */
.lab{display:flex;align-items:center;gap:12px;background:var(--paper);color:var(--ink);padding:10px 14px 10px 10px;border-radius:4px;box-shadow:0 8px 18px rgba(0,0,0,.5);transform:rotate(-1deg);max-width:420px}
.lab .mk{width:92px;flex:none}
.lab .mk svg{width:100%;display:block;border:3px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.lab h3{font-size:14px;margin-bottom:4px}
.lab ul{list-style:none;font:700 14px Inter;line-height:1.55}
.lab .x{color:var(--red)}.lab .v{color:#2e7d32}
.cast{display:flex;justify-content:center;gap:clamp(8px,4vw,40px);padding-top:96px}
.cast .who{width:min(28vw,130px);cursor:pointer;transition:transform .15s}
.cast .who:hover{transform:translateY(-4px)}
.tagno{display:inline-block;background:var(--paper);color:var(--ink);font:700 12px Oswald;padding:1px 8px;margin-top:4px;letter-spacing:.06em}
.liar{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);color:var(--red);border:3px solid var(--red);background:rgba(255,240,235,.85);font:700 18px Oswald;padding:0 8px;letter-spacing:.06em;animation:stamp .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-14deg) scale(2.5);opacity:0}}
.who.dim{pointer-events:none}.who.dim>:not(.bubble):not(.liar){opacity:.45}

/* Sala 3 */
.r3{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center;width:100%;max-width:560px}
.evi{background:#f6f1e6;padding:6px 6px 24px;box-shadow:0 8px 18px rgba(0,0,0,.5);transform:rotate(-2deg);position:relative;text-align:center}
.evi svg{display:block;width:100%}
.evi span{position:absolute;bottom:4px;left:0;right:0;font:700 12px Oswald;text-transform:uppercase;color:#3a3328;letter-spacing:.06em}
.evi .x3{position:absolute;top:-10px;right:-10px;background:var(--red);color:#fff;font:700 15px Oswald;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.r3 .victim{width:100%;max-width:150px;justify-self:center;padding-top:50px}
.clay{width:100%;max-width:560px;height:150px;border-radius:22px;background:radial-gradient(ellipse at 30% 30%,#a9d293,#6f9d5b 70%,#5b864a);box-shadow:inset 0 -8px 14px rgba(0,0,0,.25),inset 0 8px 12px rgba(255,255,255,.3),0 10px 20px rgba(0,0,0,.45);position:relative;display:grid;place-items:center;overflow:hidden}
.clay .txt{font:700 15px Oswald;text-transform:uppercase;letter-spacing:.1em;color:rgba(28,48,20,.55)}
.clay .imp{position:absolute;inset:0;display:grid;place-items:center}
.clay .imp svg{width:60%;height:80%}
.clay .press{position:absolute;left:50%;top:50%;width:46px;margin:-80px 0 0 -23px;animation:pressdown .55s ease-in forwards}
@keyframes pressdown{0%{transform:translateY(-60px) rotate(-20deg)}60%{transform:translateY(10px) rotate(0) scaleY(.92)}100%{transform:translateY(-90px);opacity:0}}
.verdict{position:absolute;top:10px;right:14px;font:700 22px Oswald;text-transform:uppercase;padding:2px 10px;border-radius:4px;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.verdict.no{background:var(--red);color:#fff}.verdict.yes{background:var(--ok);color:#fff}
.tray{display:flex;justify-content:center;gap:clamp(14px,6vw,40px);background:rgba(0,0,0,.45);border:1px solid #3d362a;border-radius:12px;padding:12px 22px 10px}
.uten{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px}
.uten svg{height:100px;width:auto;pointer-events:none}
.uten .tg{background:var(--paper);color:var(--ink);font:700 12px Oswald;padding:1px 8px;letter-spacing:.05em}
.uten.used{opacity:.5}

/* Sala 3 — cena */
.play:has(.r3g),.play:has(.scene4){max-width:1250px}
.r3g{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(250px,1fr);gap:18px;width:100%;max-width:1250px;align-items:center}
.hscene{max-height:calc(100dvh - 280px);width:auto!important;max-width:100%}
@media(max-width:860px){.r3g{grid-template-columns:1fr;gap:12px}}
.hscene{position:relative;width:100%;aspect-ratio:800/480;border-radius:10px;overflow:hidden;border:4px solid #000;box-shadow:0 14px 30px rgba(0,0,0,.55)}
.hscene svg{display:block;width:100%;height:100%;touch-action:manipulation}
.hscene .ut,.hscene .decoy,.hscene .prop{cursor:pointer}
.hscene .ut.found{opacity:0;transition:opacity .35s;pointer-events:none}
.wig{animation:wig .35s}
@keyframes wig{25%{opacity:.75}50%{opacity:1}75%{opacity:.8}}
.toast{position:absolute;transform:translate(-50%,-120%);background:#fff;color:#111;font:700 12.5px Inter;padding:6px 10px;border-radius:10px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.45);pointer-events:none;animation:toast 1.3s ease-out forwards;z-index:5}
.toast.ok{background:var(--ok);color:#fff}
@keyframes toast{0%{opacity:0;margin-top:6px}15%{opacity:1;margin-top:0}75%{opacity:1}100%{opacity:0;margin-top:-14px}}
.side3{display:flex;flex-direction:column;gap:10px}
.cnt{text-align:center;font:500 15px Oswald;text-transform:uppercase;letter-spacing:.06em;color:#d9cfb8}
.cnt b{color:var(--y);font-size:18px}
.tray3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:rgba(0,0,0,.55);border:1px solid #3d362a;border-radius:10px;padding:8px}
.tslot3{height:100px;border:2px dashed #4a4335;border-radius:8px;display:grid;place-items:center;color:#6b5f48;font:700 26px Oswald}
.tslot3.got{border:2px solid #6b5f48;background:rgba(255,255,255,.04);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.tslot3 .uten svg{height:62px}
.tslot3 .uten .tg{font-size:11px;white-space:nowrap}
.evitxt{background:var(--paper);color:var(--ink);padding:9px 10px;box-shadow:0 6px 14px rgba(0,0,0,.5);transform:rotate(-2deg)}
.evitxt b{font:700 14px Oswald;text-transform:uppercase;letter-spacing:.06em;color:var(--red)}
.evitxt p{font:700 12.5px/1.45 Inter;margin-top:3px}.evitxt i{font-weight:500;color:#6b604c}
.evitxt li.x{text-decoration:line-through;color:#8a7f6a}
.clayrow{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:center}
.clayrow .evi{padding:5px 5px 22px}.clayrow .evi span{font-size:10px}
.clayrow .evi .x3{width:28px;height:28px;font-size:13px;top:-8px;right:-8px}
.clayrow .clay{height:124px}
.clayrow .clay .press{width:34px;margin:-60px 0 0 -17px}
.clay .verdict{font-size:16px;top:8px;right:8px}
@media(max-width:860px){.hscene{width:calc(100% + 28px)!important;max-width:none;margin:0 -14px;border-radius:0;border-left:0;border-right:0}.tslot3{height:86px}.tslot3 .uten svg{height:52px}.clayrow .clay{height:110px}}

/* Sala 4 — cena */
.r4g{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(240px,1fr);grid-template-areas:"scene clues" "scene fichas";gap:14px 20px;width:100%;max-width:1250px;align-items:center}
.r4g .clues{grid-area:clues;flex-direction:column;align-items:center;align-self:end}
.r4g .fbox{grid-area:fichas;align-self:start;display:flex;flex-direction:column;gap:6px}
.r4g .fichas{grid-template-columns:1fr}
.r4g .fic{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:2px 8px;text-align:left}
.r4g .fic .plaque{grid-row:span 3}
.r4g .fic .acc{justify-content:flex-start;margin:0}
@media(max-width:900px){.r4g{grid-template-columns:1fr;grid-template-areas:"clues" "scene" "fichas"}.r4g .clues{flex-direction:row}.r4g .fichas{grid-template-columns:repeat(3,1fr)}.r4g .fic{display:block;text-align:center}.r4g .fic .acc{justify-content:center;margin-top:5px}}
.scene4{grid-area:scene;justify-self:center;position:relative;width:min(100%,calc((100dvh - 250px)*1.533));min-width:min(100%,340px);aspect-ratio:1200/783;background:var(--room4) center/cover no-repeat;border:4px solid #000;border-radius:10px;box-shadow:0 14px 30px rgba(0,0,0,.55);touch-action:none;cursor:crosshair}
.scene4::before{content:"";position:absolute;inset:0;border-radius:6px;background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(0,0,0,.5));pointer-events:none}
.scene4 .neon{position:absolute;inset:0;width:100%;height:100%}
.scene4 #hot,.scene4 .dec{cursor:crosshair}
.dark{position:absolute;inset:0;border-radius:6px;z-index:1;pointer-events:none;--x:10%;--y:75%;--r:90px;background:radial-gradient(circle var(--r) at var(--x) var(--y),rgba(0,0,0,0) 0,rgba(0,0,0,.1) 45%,rgba(0,0,0,.985) 100%);transition:opacity 1s}
.scene4.caught .dark{opacity:0}
.scene4 .nline{opacity:0}
.scene4 .q{opacity:.55}
.scene4.caught .neon{z-index:3}
.scene4.caught .nline{opacity:1;animation:neonOn 1s steps(1) both}
.scene4.caught .q{opacity:1;fill:#f5c42c;filter:url(#ng);animation:neonOn 1s steps(1) both}
@keyframes neonOn{0%{opacity:0}15%{opacity:1}25%{opacity:.2}40%{opacity:1}50%{opacity:.3}65%,100%{opacity:1}}
.torch-hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:4;background:rgba(0,0,0,.75);border:1px solid #f5c42c;color:#f5c42c;font:700 13px Oswald;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:999px;pointer-events:none;transition:opacity .4s;animation:btnpulse 1.4s ease-in-out infinite}
.torch-hint.gone{opacity:0}
.flick{animation:flick 5s infinite}
@keyframes flick{0%,17%,21%,60%,63%,100%{opacity:.9}19%,61.5%{opacity:.3}}
.neon-who{position:absolute;width:1px;height:1px;z-index:5}
#bot{transition:filter .4s}
.scene4.caught #bot{filter:url(#ng)}
.scene4.caught #bot>path{animation:neonOn 1s steps(1) both}
.ins{position:absolute;bottom:2%;width:12.5%;cursor:pointer;z-index:2}
.ins .plaque{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);font-size:clamp(10px,1.6vw,14px)}
.ins.dim{pointer-events:none}.ins.dim>:not(.bubble){opacity:.4}
.fichas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:760px}
.fic{background:rgba(0,0,0,.6);border:1px solid #3d362a;border-radius:8px;padding:7px 6px;text-align:center}
.fic .nm{font-size:11.5px}
@media(max-width:520px){.fic .acc i{width:24px;font-size:9px}.fic .nm{display:block;font-size:10.5px}}

/* Sala 4 */
.clues{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:640px}
.clue{background:var(--paper);color:var(--ink);font:700 13px/1.35 Inter;padding:7px 12px;border-radius:4px;box-shadow:0 4px 10px rgba(0,0,0,.4);max-width:330px;align-self:center}
.clues .stack{display:flex;flex-direction:column;gap:8px;justify-content:center}
.clue b{color:var(--red)}
.lineup{width:100%;max-width:700px;position:relative;padding:72px 6px 10px;border-radius:8px;background:
  repeating-linear-gradient(180deg,transparent 0 27px,rgba(255,255,255,.12) 27px 28px),linear-gradient(#26231e,#1a1814);border:1px solid #3d362a}
.lineup .row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sus{position:relative;text-align:center;cursor:pointer;transition:transform .15s}
.sus:hover{transform:translateY(-4px)}
.sus .chr{max-width:120px;margin:0 auto}
.plaque{background:#111;color:#fff;font:700 13px Oswald;display:inline-block;padding:1px 8px;margin-top:-4px;border:1px solid #444}
.sus .nm{font-size:11px}
.acc{display:flex;justify-content:center;gap:3px;margin-top:5px}
.acc i{font-style:normal;font:700 9.5px Inter;width:26px;padding:2px 0;border-radius:3px;background:#333;color:#999}
.acc i.in{background:#2e7d32;color:#fff}.acc i.out{background:#8f1f1a;color:#fff}.acc i.q{background:#4a4335;color:var(--y)}
.badge{font:700 10.5px Inter;margin-top:4px;color:#cfc5b0}
.badge .yes{color:#7ddc8a}.badge .no{color:#ff7b6e}
.sus.dim{pointer-events:none}.sus.dim>:not(.bubble){opacity:.4}
.sus.caught .chr{filter:drop-shadow(0 0 16px rgba(245,196,44,.9))}
.legend{font-size:11.5px;color:var(--muted);text-align:center}
.legend i{font-style:normal;display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin:0 3px 0 8px}

/* Sala 5 */
.report5{background:#fff;color:#222;width:100%;max-width:520px;padding:20px 20px 18px;box-shadow:0 12px 26px rgba(0,0,0,.55);position:relative;transform:rotate(-.6deg)}
.report5 h3{text-align:center;font-size:18px;margin-bottom:14px}
.report5 .ln{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:700 17px Inter;padding:10px 0;border-top:1px solid #ddd}
.report5 .ln:last-of-type{border-bottom:1px solid #ddd}
.wslot{min-width:118px;height:42px;border:2px dashed #b9b2a2;border-radius:4px;display:inline-grid;place-items:center;font:700 13px Inter;color:#9b927f;padding:0 8px;background:#faf8f2}
.wslot.filled{border:0;background:none;padding:0}
.wslot:not(.filled)::before{content:"?";font:700 22px Oswald;color:#c9c1ad}
.pieces{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:560px}
.piece{background:var(--paper);color:var(--ink);font:700 18px Oswald;letter-spacing:.06em;padding:9px 16px;box-shadow:0 5px 10px rgba(0,0,0,.45);clip-path:polygon(0 8%,10% 0,22% 6%,36% 0,50% 7%,64% 1%,78% 7%,90% 0,100% 6%,100% 92%,88% 100%,74% 93%,58% 100%,44% 93%,30% 100%,16% 94%,0 100%)}
.piece.placed{background:var(--y)}
.closed{position:absolute;right:10px;top:40%;color:var(--red);border:4px double var(--red);font:700 26px Oswald;padding:0 10px;transform:rotate(-10deg);animation:stamp .4s cubic-bezier(.3,1.6,.5,1);background:rgba(255,255,255,.7)}

/* Mapa */
.mapv .room-head{margin-bottom:8px}
.map{position:relative;width:min(92vw,calc((100dvh - 210px)*0.6923),440px);aspect-ratio:360/520;background:#15130f;border:6px solid #000;border-radius:10px;box-shadow:0 0 0 2px #3d362a,0 20px 40px rgba(0,0,0,.5);overflow:hidden}
.map::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:20px 20px}
.map svg.route{position:absolute;inset:0;width:100%;height:100%}
.room{position:absolute;border-radius:6px;background-size:cover;background-position:center;border:2px solid #4a4335;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 7px;transition:.4s}
.room::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.8))}
.room>*{position:relative}
.room .rn{font:700 clamp(11px,3vw,14px)/1.05 Oswald;text-transform:uppercase;letter-spacing:.03em}
.room .st{position:absolute;top:6px;right:6px;font-size:16px}
.room .mkr{position:absolute;top:5px;left:6px;width:24px}
.room.locked{filter:grayscale(1) brightness(.55)}
.room.cur{border-color:var(--y);box-shadow:0 0 0 3px rgba(245,196,44,.35),0 0 24px rgba(245,196,44,.45);cursor:pointer;animation:roomglow 1.4s ease-in-out infinite}
@keyframes roomglow{50%{box-shadow:0 0 0 6px rgba(245,196,44,.15),0 0 30px rgba(245,196,44,.6)}}
.room.done{border-color:#6b5f48}
.entr{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font:700 11px Oswald;letter-spacing:.14em;color:#111;background:var(--y);padding:1px 8px}
.token{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:var(--y);display:grid;place-items:center;box-shadow:0 0 0 4px rgba(245,196,44,.3),0 6px 14px rgba(0,0,0,.6);z-index:5}
.token svg{width:22px}
.token.walk svg{animation:wob .3s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.mapv .go{margin-top:16px}

/* Banner de sucesso */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;padding:0 12px 14px;animation:up .4s cubic-bezier(.3,1.3,.5,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet-in{width:100%;max-width:520px;background:var(--paper);color:var(--ink);border-radius:12px;padding:20px 18px 18px;text-align:center;box-shadow:0 -10px 40px rgba(0,0,0,.6);position:relative;overflow:hidden}
.sheet-in::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:repeating-linear-gradient(-45deg,var(--y) 0 14px,#111 14px 28px)}
.sheet h3{font-size:26px;margin:6px 0 4px}
.sheet p{font-size:15px;margin-bottom:14px}
.sheet .code{font:700 30px Oswald;letter-spacing:.3em;color:#111;background:var(--y);display:inline-block;padding:0 10px 0 16px;margin-bottom:10px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;animation:fadein .3s}

/* Modal */
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.75);display:grid;place-items:center;padding:20px}
.modal-card{max-width:400px;width:100%;background:var(--paper);color:var(--ink);padding:26px 22px 22px;text-align:center;border-radius:10px}
.modal-card h3{font-size:28px;margin-bottom:8px}.modal-card p{margin-bottom:18px;line-height:1.5}

/* Final */
.final{text-align:center}
.stamp-big{display:inline-block;color:var(--red);border:5px double var(--red);font:700 clamp(28px,7vw,50px) Oswald;text-transform:uppercase;padding:2px 18px;transform:rotate(-6deg);margin:16px 0 18px;background:rgba(209,31,31,.08)}
@keyframes stampbig{from{transform:rotate(-6deg) scale(2.4);opacity:0}}
.fin{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;max-width:760px;text-align:left}
@media(max-width:700px){.fin{grid-template-columns:1fr;text-align:center;gap:18px}}
/* ---- Revelação animada do molho ---- */
.cell{width:250px;margin:0 auto;background:var(--y);padding:12px 12px 10px;border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 60px rgba(245,196,44,.25);color:#111;text-align:center;position:relative}
.win{position:relative;height:350px;border-radius:4px;overflow:hidden;background:radial-gradient(circle at 50% 55%,#3a2f12,#0d0c0a 70%)}
.rays{position:absolute;left:50%;top:52%;width:700px;height:700px;margin:-350px 0 0 -350px;background:repeating-conic-gradient(rgba(245,196,44,.22) 0 10deg,transparent 10deg 22deg);-webkit-mask:radial-gradient(circle,#000 10%,transparent 60%);mask:radial-gradient(circle,#000 10%,transparent 60%);opacity:0;transition:opacity .4s;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rev .rays{opacity:1}
.sil{position:absolute;left:50%;top:50%;width:150px;margin:-150px 0 0 -75px;filter:drop-shadow(0 0 10px rgba(245,196,44,.9)) drop-shadow(0 0 30px rgba(245,196,44,.5));animation:silshake 1.5s ease-in both}
@keyframes silshake{0%{transform:scale(.9)}20%{transform:scale(1)}30%,50%,70%,90%{transform:translateX(-3px) rotate(-2deg)}40%,60%,80%,100%{transform:translateX(3px) rotate(2deg)}}
.rev .sil{opacity:0;transform:scale(1.6);transition:.25s}
.molho{position:absolute;left:50%;bottom:14px;height:300px;margin-left:-75px;transform-origin:50% 100%;opacity:0}
.rev .molho{opacity:1;animation:popin .8s cubic-bezier(.3,1.5,.5,1) both,idle 3.4s ease-in-out 1.2s infinite}
@keyframes popin{0%{transform:translateY(80px) scale(.3,.2)}45%{transform:translateY(-20px) scale(.9,1.15)}65%{transform:translateY(0) scale(1.14,.86)}82%{transform:scale(.95,1.06)}100%{transform:scale(1)}}
@keyframes idle{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-6px) rotate(-2deg)}50%{transform:translateY(0) scale(1.05,.95)}75%{transform:translateY(-4px) rotate(2deg)}}
.bars{position:absolute;inset:0;display:flex;justify-content:space-evenly;transform:translateY(-105%);z-index:3}
.bars i{width:9px;background:linear-gradient(90deg,#4a4f55,#c9ced3 45%,#5d6369);box-shadow:2px 0 4px rgba(0,0,0,.5)}
.bars::before,.bars::after{content:"";position:absolute;left:0;right:0;height:10px;background:linear-gradient(#c9ced3,#4a4f55);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.bars::before{top:18%}.bars::after{bottom:14%}
.jail .bars{animation:slam .55s cubic-bezier(.5,0,.6,1.4) forwards}
@keyframes slam{to{transform:translateY(0)}}
.jail .cell{animation:thud .35s ease .45s}
@keyframes thud{40%{transform:translateY(6px)}}
.drip{position:absolute;top:0;left:0;right:0;height:60px;z-index:4;pointer-events:none}
.drip path{transform-origin:top;transform:scaleY(0)}
.rev .drip path{animation:dripdown 1.6s cubic-bezier(.4,0,.2,1) forwards}
@keyframes dripdown{to{transform:scaleY(1)}}
.flash{position:fixed;inset:0;background:#fff8dc;z-index:80;pointer-events:none;animation:flash .6s ease-out forwards}
@keyframes flash{from{opacity:.95}to{opacity:0}}
.pt{position:absolute;left:50%;top:55%;z-index:2;pointer-events:none;animation:burst 1.3s cubic-bezier(.2,.7,.4,1) forwards}
.pt.k{width:14px;height:17px;margin:-8px;border-radius:45% 45% 40% 40%;background:radial-gradient(circle at 35% 30%,#fff3a0,#f5c42c 45%,#d99a0b)}
.pt.b{width:16px;height:13px;margin:-7px;border-radius:3px;background:linear-gradient(135deg,#fff8d6,#f7e08f)}
.pt.s{width:12px;height:12px;margin:-6px;border-radius:50%;background:#f2c12e}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(.4);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}}
.plate b{display:block;font:700 22px Oswald;margin-top:8px}
.plate small{font:700 10.5px Oswald;text-transform:uppercase;letter-spacing:.05em}
.fin-txt{opacity:0;transform:translateY(14px);transition:.6s}
.done .fin-txt{opacity:1;transform:none}
.final .stamp-big{opacity:0}
.done .stamp-big{opacity:1;animation:stampbig .5s cubic-bezier(.3,1.6,.5,1) both}
.cheer{opacity:0;transition:opacity .6s .3s}.done .cheer{opacity:1}
.fin h2{font-size:clamp(32px,6vw,46px);color:var(--y)}
.fin p{color:#ddd3bd;margin:8px 0 14px;line-height:1.5}
.stats{display:flex;gap:10px;margin-bottom:18px}
@media(max-width:700px){.stats,.ctas{justify-content:center}}
.stats div{background:rgba(0,0,0,.5);border:1px solid #3d362a;border-radius:6px;padding:6px 14px}
.stats b{display:block;font:700 22px Oswald;color:var(--y)}
.stats small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.ctas{display:flex;gap:10px;flex-wrap:wrap}
.cheer{display:flex;justify-content:center;gap:6px;margin-top:26px;padding-top:44px}
.cheer .who{width:min(24vw,100px)}
</style>

function track(event, data = {}) {
  const p = { event: 'santa_mordida_' + event, ...data };
  try { (window.dataLayer = window.dataLayer || []).push(p); } catch (e) {}
  try { if (window.parent !== window) window.parent.postMessage({ source: 'santa-mordida', ...p }, '*'); } catch (e) {}
}

/* =========================================================
   SOM (sintetizado, sem arquivos)
   ========================================================= */
let AC = null, muted = false;
function beep(f, d = .08, type = 'triangle', v = .05, w = 0) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + w;
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
const SFX = {
  tap: () => beep(700, .05, 'triangle', .04),
  ok: () => { beep(523, .1); beep(784, .16, 'triangle', .05, .09); },
  err: () => { beep(180, .2, 'sawtooth', .04); beep(140, .25, 'sawtooth', .04, .1); },
  tick: () => beep(1400, .02, 'square', .015),
  squish: () => { beep(120, .18, 'sine', .14); },
  unlock: () => { beep(300, .05, 'square', .04); beep(900, .12, 'triangle', .05, .06); },
  win: () => [523, 659, 784, 1046].forEach((f, i) => beep(f, .2, 'triangle', .06, i * .11)),
  step: () => beep(220, .04, 'sine', .05),
};

/* =========================================================
   PERSONAGENS (SVG originais)
   ========================================================= */
function face(cx, cy, mood = 'hurt', s = 1) {
  const ex = 12 * s, er = 5.6 * s, st = 'stroke="#1a1a1a" stroke-width="1.6"';
  const eye = x => `<ellipse cx="${x}" cy="${cy}" rx="${er}" ry="${er * 1.18}" fill="#fff" ${st}/><circle cx="${x + (mood === 'shifty' ? 2.5 : .8)}" cy="${cy + 1}" r="${er * .55}" fill="#1a1a1a"/>`;
  let eyes = eye(cx - ex) + eye(cx + ex);
  if (mood === 'dizzy') eyes = [cx - ex, cx + ex].map(x => `<path d="M${x - 4} ${cy - 4}L${x + 4} ${cy + 4}M${x + 4} ${cy - 4}L${x - 4} ${cy + 4}" stroke="#1a1a1a" stroke-width="2.6" stroke-linecap="round"/>`).join('');
  if (mood === 'happy') eyes = [cx - ex, cx + ex].map(x => `<path d="M${x - 5} ${cy + 2}Q${x} ${cy - 5} ${x + 5} ${cy + 2}" fill="none" stroke="#1a1a1a" stroke-width="2.6" stroke-linecap="round"/>`).join('');
  const L = (a, b, c, d) => `<path d="M${a} ${b}L${c} ${d}" stroke="#1a1a1a" stroke-width="2.6" stroke-linecap="round"/>`;
  let brows = '';
  if (['hurt', 'nervous', 'dizzy'].includes(mood)) brows = L(cx - ex - 6, cy - 8 * s, cx - ex + 5, cy - 12 * s) + L(cx + ex + 6, cy - 8 * s, cx + ex - 5, cy - 12 * s);
  if (['angry', 'shifty'].includes(mood)) brows = L(cx - ex - 6, cy - 12 * s, cx - ex + 5, cy - 8 * s) + L(cx + ex + 6, cy - 12 * s, cx + ex - 5, cy - 8 * s);
  const my = cy + 13 * s;
  let mouth;
  if (mood === 'happy') mouth = `<path class="mouth" d="M${cx - 9} ${my - 3}Q${cx} ${my + 9} ${cx + 9} ${my - 3}Z" fill="#7a1d1d" ${st}/>`;
  else if (mood === 'hurt' || mood === 'dizzy') mouth = `<ellipse class="mouth" cx="${cx}" cy="${my + 1}" rx="${5 * s}" ry="${6 * s}" fill="#7a1d1d" ${st}/>`;
  else if (mood === 'nervous') mouth = `<path class="mouth" d="M${cx - 8} ${my}q2 -3 4 0t4 0t4 0t4 0" fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>`;
  else mouth = `<path class="mouth" d="M${cx - 7} ${my + 1}Q${cx} ${my - 3} ${cx + 7} ${my + 1}" fill="none" stroke="#1a1a1a" stroke-width="2.6" stroke-linecap="round"/>`;
  const sweat = mood === 'nervous' ? `<path d="M${cx + ex + 12} ${cy - 10}q-4 7 0 9q4 -2 0 -9Z" fill="#7ec8f5" stroke="#3b82b8"/>` : '';
  const tear = mood === 'hurt' ? `<path d="M${cx - ex - 2} ${cy + 7}q-3 6 0 8q3 -2 0 -8Z" fill="#9fd6f7"/>` : '';
  return `<g>${brows}${eyes}${mouth}${sweat}${tear}</g>`;
}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = s => { const a = Math.abs(s); return `${String(Math.floor(a / 60)).padStart(2, '0')}:${String(a % 60).padStart(2, '0')}`; };

function say(who, text, ms = 2200, cls = '') {
  let b = $('.bubble', who);
  if (!b) { b = document.createElement('div'); who.prepend(b); }
  b.className = 'bubble ' + (who.dataset.b || '') + ' ' + cls; b.innerHTML = text;
  b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
  who.classList.add('talk'); clearTimeout(who._t);
  who._t = setTimeout(() => who.classList.remove('talk'), Math.min(ms, 1400));
}
function shake(el) { el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope'); }

/* Arrastar e soltar (mouse + toque), com alternativa de tocar-para-escolher */
function enableDrag(root, dragSel, dropSel, onDrop) {
  let selected = null;
  const drops = () => $$(dropSel, root).filter(d => !d.classList.contains('filled'));
  const dropAt = (x, y) => { for (const e of document.elementsFromPoint(x, y)) { const d = e.closest && e.closest(dropSel); if (d && root.contains(d)) return d; } return null; };
  const clearSel = () => { selected && selected.classList.remove('sel'); selected = null; $$(dropSel, root).forEach(d => d.classList.remove('hint-drop')); };
  $$(dragSel, root).forEach(el => {
    el.addEventListener('pointerdown', e => {
      if (el.classList.contains('placed') || el.classList.contains('used-lock')) return;
      e.preventDefault();
      const r = el.getBoundingClientRect(), sx = e.clientX, sy = e.clientY;
      let ghost = null, moved = false, over = null;
      const move = ev => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!moved && Math.hypot(dx, dy) < 8) return;
        if (!moved) { moved = true; clearSel(); ghost = el.cloneNode(true); ghost.classList.add('dragghost'); ghost.style.width = r.width + 'px'; document.body.appendChild(ghost); el.classList.add('lifted'); SFX.tap(); }
        ghost.style.transform = `translate(${r.left + dx}px,${r.top + dy}px) rotate(-5deg) scale(1.08)`;
        const t = dropAt(ev.clientX, ev.clientY);
        if (t !== over) { over && over.classList.remove('over'); over = t; over && over.classList.add('over'); }
      };
      const up = ev => {
        removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
        over && over.classList.remove('over');
        if (moved) { ghost.remove(); el.classList.remove('lifted'); const t = dropAt(ev.clientX, ev.clientY); if (t) onDrop(el, t); }
        else {
          const ds = drops();
          if (ds.length === 1) { clearSel(); onDrop(el, ds[0]); return; }   // um só destino: tocar já solta
          if (selected === el) { clearSel(); return; }
          clearSel(); selected = el; el.classList.add('sel'); SFX.tap(); ds.forEach(d => d.classList.add('hint-drop'));
        }
      };
      addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
    });
  });
  $$(dropSel, root).forEach(d => d.addEventListener('click', () => { if (selected) { const s = selected; clearSel(); onDrop(s, d); } }));
}

const S = { i: 0, start: 0, pen: 0, errors: 0, timerId: null, timeUp: false, busy: false };
const used = () => Math.floor((Date.now() - S.start) / 1000) + S.pen;
function penalize() {
  S.pen += CONFIG.penalidadeErro; S.errors++; SFX.err; SFX.err();
  const p = document.createElement('div'); p.className = 'pen'; p.textContent = `−${CONFIG.penalidadeErro}s`;
  $('#timer').appendChild(p); setTimeout(() => p.remove(), 1000); tick();
  track('erro', { sala: S.i + 1 });
}
function tick() {
  const left = CONFIG.tempoLimiteSegundos - used(), t = $('#timer');
  t.firstChild ? t.firstChild.nodeValue = (left < 0 ? '+' : '') + fmt(left) : t.textContent = fmt(left);
  t.className = 'timer' + (left < 0 ? ' over' : left <= 60 ? ' warn' : '');
  if (left <= 0 && !S.timeUp) {
    S.timeUp = true; track('tempo_esgotado', { sala: S.i + 1 });
    modal('⏰ O tempo acabou!', 'O culpado ainda está à solta. Quer continuar investigando?', [['Continuar', closeModal], ['Recomeçar', () => { closeModal(); start(); }, true]]);
  }
}

const LEGS = [
  [[180, 512], [180, 425], [95, 425]],
  [[95, 425], [265, 425]],
  [[265, 425], [265, 265]],
  [[265, 265], [95, 265]],
  [[95, 265], [95, 183], [180, 183], [180, 95]],

const pct = ([x, y]) => [x / 360 * 100, y / 520 * 100];

async function showMap(k) {
  S.busy = false; dots();
  const app = $('#app');
  const done = LEGS.slice(0, k).flat(), next = LEGS[k];
  app.innerHTML = `<section class="screen mapv fade"><div class="bg" style="background-image:var(--${ROOMS[k].img})"></div>
    <div class="room-head"><div class="kicker">Mapa do Arquivo</div><h2>${k === 0 ? 'Entre no arquivo' : 'Próxima sala'}</h2></div>
    <div class="map" id="map">
      <svg class="route" viewBox="0 0 360 520" preserveAspectRatio="none">
        <polyline points="${LEGS.flat().map(p => p.join(',')).join(' ')}" fill="none" stroke="#4a4335" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
        ${done.length ? `<polyline points="${done.map(p => p.join(',')).join(' ')}" fill="none" stroke="#f5c42c" stroke-width="3.5" stroke-dasharray="2 9" stroke-linecap="round"/>` : ''}
        <polyline id="walk" points="" fill="none" stroke="#f5c42c" stroke-width="3.5" stroke-dasharray="2 9" stroke-linecap="round"/>
      </svg>
      ${ROOMS.map((r, j) => `<div class="room ${j < k ? 'done' : j === k ? 'locked' : 'locked'}" data-j="${j}" style="left:${r.x / 3.6}%;top:${r.y / 5.2}%;width:${r.w / 3.6}%;height:${r.h / 5.2}%;background-image:var(--${r.img})">
        <span class="mkr">${marker(j + 1)}</span><span class="st">${j < k ? '✅' : '🔒'}</span><span class="rn">${r.name}</span></div>`).join('')}
      <span class="entr">Entrada</span>
      <div class="token" id="token">${lupa}</div>
    </div>
    <button class="btn go hidden" id="goBtn"></button></section>`;
  const tok = $('#token'), walk = $('#walk');
  const place = p => { const [x, y] = pct(p); tok.style.left = x + '%'; tok.style.top = y + '%'; };
  place(next[0]);
  await sleep(450);
  // anda pelo caminho
  const segs = []; let total = 0;
  for (let i = 0; i < next.length - 1; i++) { const a = next[i], b = next[i + 1], l = Math.hypot(b[0] - a[0], b[1] - a[1]); segs.push([a, b, l]); total += l; }
  const dur = Math.max(900, total * 7); tok.classList.add('walk');
  let lastStep = 0;
  await new Promise(res => {
    const t0 = performance.now();
    const fr = now => {
      const f = Math.min(1, (now - t0) / dur); let d = f * total; const pts = [next[0]]; let p = next[0];
      for (const [a, b, l] of segs) { if (d >= l) { pts.push(b); p = b; d -= l; } else { p = [a[0] + (b[0] - a[0]) * d / l, a[1] + (b[1] - a[1]) * d / l]; pts.push(p); break; } }
      place(p); walk.setAttribute('points', pts.map(q => q.join(',')).join(' '));
      if (now - lastStep > 220) { SFX.step(); lastStep = now; }
      f < 1 ? requestAnimationFrame(fr) : res();
    };
    requestAnimationFrame(fr);
  });
  tok.classList.remove('walk');
  const room = $(`.room[data-j="${k}"]`); room.classList.remove('locked'); room.classList.add('cur'); $('.st', room).textContent = '👆';
  SFX.unlock();

function roomShell(k, title, sub, playHTML, code) {
  return `<section class="screen fade"><div class="bg" style="background-image:var(--${k === 3 ? 's3' : ROOMS[k].img})${k === 3 ? ';filter:brightness(.15) blur(8px)' : ''}"></div>
    <div class="room-head"><div class="kicker">Sala ${k + 1} · ${ROOMS[k].name}</div><h2>${title}</h2><p>${sub}</p>
      ${code ? `<div style="display:flex;justify-content:center"><div class="mlock" id="mlock"><div class="pad"><div class="shk"></div><div class="pb">${[...code].map(() => '<span>–</span>').join('')}</div></div><div class="lbl">Cadeado<br>trancado</div></div></div>` : ''}
    </div>
    <div class="play">${playHTML}</div></section>`;
}

async function solve(code, title, reward) {
  if (S.busy) return; S.busy = true;
  track('sala_concluida', { sala: S.i + 1, tempo: used() });
  if (code) {
    const ml = $('#mlock'), spans = $$('.pb span', ml);
    for (let d = 0; d < spans.length; d++) {
      for (let r = 0; r < 7; r++) { spans[d].textContent = Math.floor(Math.random() * 10); SFX.tick(); await sleep(45); }
      spans[d].textContent = code[d]; SFX.tap(); await sleep(90);
    }
    await sleep(200); ml.classList.add('open'); $('.lbl', ml).innerHTML = 'Cadeado<br>aberto!'; SFX.unlock();
    await sleep(500);
  }
  SFX.ok();
  $('#layer').innerHTML = `<div class="shade"></div><div class="sheet"><div class="sheet-in">
    <div style="font-size:34px">🔓</div><h3>${title}</h3>
    ${code ? `<div class="code">${code}</div>` : ''}
    <p>${reward}</p><button class="btn pulse" id="nextBtn">Próxima sala →</button></div></div>`;
  $('#nextBtn').onclick = () => { SFX.tap(); closeModal(); S.i++; showMap(S.i); };
}

function renderRoom(k) {
  S.i = k; dots(); track('sala_inicio', { sala: k + 1 });
  window.scrollTo(0, 0);
  ROOM_FN[k]();
}

      else if (pr) { SFX.tap(); pr.classList.remove('wig'); void pr.getBoundingClientRect(); pr.classList.add('wig'); }
    });
  },

  /* ---------- 4. Suspeitos ---------- */
  () => {
    const P = [
      { n: '01', name: 'Chef Tonho', acc: [1, 1, 1], alibi: 'Tenho crachá, chefia! Tô nas câmeras!', x: 2, b: 'bl' },
      { n: '02', name: 'Gerente Rosa', acc: [0, 0, 0], alibi: 'Eu tava de folga!', x: 26, b: 'bl' },
      { n: '03', name: 'Beto Entregas', acc: [1, 0, 1], alibi: 'Às 21h eu tava na rua!', x: 47, b: '' },
    ];
    const SPOTS = [{ x: 848, y: 640 }, { x: 1092, y: 668 }, { x: 378, y: 478 }, { x: 922, y: 452 }];
    const spot = SPOTS[Math.floor(Math.random() * SPOTS.length)], BH = window.innerWidth < 700 ? 104 : 74, BW = BH * 120 / 150;
    $('#app').innerHTML = roomShell(3, 'Quem é o culpado?', 'Apagaram as luzes! Use a <b>lanterna</b> para investigar a sala e <b>toque no culpado</b>.', `<div class="r4g">
      <div class="clues"><div class="evphoto"><img src="${IMG.luva}" alt="Luva e tampa sujas de molho amarelo"><span>Vestígios na cena</span></div>
        <div class="stack"><div class="clue">📷 Câmera: um vulto <b>SEM crachá</b> aparece nas 3 cenas, com uma colher.</div><div class="clue">🟡 Rastro <b>amarelo e cremoso</b>. Não é da cozinha.</div></div></div>
      <div class="scene4" id="scene4">
        <svg class="neon" viewBox="0 0 1200 783" preserveAspectRatio="none">
          <defs><filter id="ng" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
          <rect class="dec" data-m="Só fotos antigas do restaurante..." x="40" y="170" width="220" height="320" fill="transparent"/>
          <rect class="dec" data-m="Uma mesa vazia. Só migalhas." x="130" y="470" width="300" height="90" fill="transparent"/>
          <rect class="dec" data-m="Nada além de cortina preta." x="420" y="220" width="360" height="320" fill="transparent"/>
          <rect class="dec" data-m="Mais papéis da investigação..." x="900" y="240" width="280" height="200" fill="transparent"/>
          <rect class="dec" data-m="Uma garrafa d’água. Nada suspeito." x="790" y="420" width="170" height="100" fill="transparent"/>
          <rect class="dec" data-m="Só banquinhos." x="740" y="520" width="240" height="140" fill="transparent"/>
          <g id="bot" transform="translate(${spot.x - BW / 2},${spot.y - BH}) scale(${BH / 150})">
            <rect x="-30" y="-30" width="180" height="210" fill="transparent" id="hot"/>
            <path d="M30 22Q60 12 90 22Q102 28 100 60Q98 88 90 102Q84 114 87 128Q90 140 84 146L36 146Q30 140 33 128Q36 114 30 102Q22 88 20 60Q18 28 30 22Z" fill="#0b0b0b" stroke="#f5c42c" stroke-width="4"/>
            <text id="botQ" x="60" y="98" text-anchor="middle" font-family="Oswald,Impact" font-weight="700" font-size="64" fill="#f5c42c">?</text>
            <g transform="rotate(20 104 96)"><ellipse cx="104" cy="70" rx="8" ry="13" fill="#9aa0a6"/><rect x="101" y="80" width="6" height="34" rx="3" fill="#9aa0a6"/></g>
          </g>
        </svg>
        <div class="dark" id="dark"></div>
        <div class="who neon-who" id="neonWho" data-b="${spot.x > 700 ? 'br' : 'bl'}" style="left:${spot.x / 12}%;top:${(spot.y - BH) / 7.83}%"></div>
        <div class="torch-hint" id="thint">🔦 Arraste para iluminar</div>
        ${P.map((p, j) => `<div class="ins who" data-j="${j}" data-b="${p.b}" style="left:${p.x}%" role="button" tabindex="0"><div class="bob d${j + 1}">${SUSPECT_SVG[p.n]()}</div><span class="plaque">${p.n}</span></div>`).join('')}
      </div>
      <div class="fbox"><div class="fichas">${P.map(p => `<div class="fic"><span class="plaque">${p.n}</span> <span class="nm">${p.name}</span>
        <div class="acc">${p.acc.map((a, h) => `<i class="${a ? 'in' : 'out'}">${['19h', '21h', '23h'][h]}</i>`).join('')}</div><div class="badge">Crachá <span class="yes">✓</span></div></div>`).join('')}</div>
      </div><div class="legend">Acesso:<i style="background:#2e7d32"></i>dentro<i style="background:#8f1f1a"></i>fora</div></div></div>`, '4444');
    const sc = $('#scene4'), dark = $('#dark');
    let lx = .1, ly = .75, seen = false, seenT = null, touched = false;
    const radius = () => Math.max(60, sc.clientWidth * .12);
    const isLit = () => { const ix = lx * 1200, iy = ly * 783, r = radius() * 1200 / sc.clientWidth; return Math.hypot(ix - spot.x, iy - (spot.y - BH / 2)) < r * .8 + 20; };
    const light = (x, y) => {
      lx = Math.min(1, Math.max(0, x)); ly = Math.min(1, Math.max(0, y));
      dark.style.setProperty('--x', lx * 100 + '%'); dark.style.setProperty('--y', ly * 100 + '%'); dark.style.setProperty('--r', radius() + 'px');
      if (isLit()) { if (!seen && !seenT) seenT = setTimeout(() => { seen = true; }, 350); } else { clearTimeout(seenT); seenT = null; }
    };
    const fromEvent = e => { const r = sc.getBoundingClientRect(); light((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height); };
    const firstTouch = () => { if (!touched) { touched = true; $('#thint').classList.add('gone'); } };
    sc.addEventListener('pointermove', e => { if (sc.classList.contains('caught')) return; firstTouch(); fromEvent(e); });
    sc.addEventListener('pointerdown', e => { if (sc.classList.contains('caught')) return; firstTouch(); fromEvent(e); });
    // demonstração: a lanterna passeia pelo lado esquerdo (longe do culpado)
    (async () => { for (let i = 0; i <= 40 && !touched; i++) { const f = i / 40; light(.08 + .32 * f, .72 - .3 * Math.sin(f * Math.PI)); await sleep(30); } })();
    window.addEventListener('resize', () => light(lx, ly));
    const toast = (e, txt) => { const r = sc.getBoundingClientRect(), d = document.createElement('div'); d.className = 'toast'; d.textContent = txt;
      d.style.left = Math.min(Math.max(e.clientX - r.left, 70), r.width - 70) + 'px'; d.style.top = (e.clientY - r.top) + 'px'; sc.appendChild(d); setTimeout(() => d.remove(), 1300); };
    $$('.dec', sc).forEach(d => d.addEventListener('click', e => { if (!S.busy) { SFX.tap(); toast(e, d.dataset.m); } }));
    $$('.ins').forEach((el, j) => el.addEventListener('click', () => {
      if (S.busy || el.classList.contains('dim')) return;
      say(el, P[j].alibi, 2000, 'err'); shake(el); el.classList.add('dim'); penalize();
    }));
    $('#bot').addEventListener('click', e => {
      if (S.busy) return;
      if (!seen) { SFX.tap(); toast(e, 'Tá muito escuro aqui...'); return; }
      sc.classList.add('caught'); $('#botQ').textContent = '04'; $('#botQ').setAttribute('font-size', '46'); SFX.unlock();
      say($('#neonWho'), 'Fui descoberto... Suspeito 04, “O Amarelo”.', 3200);
      $$('.ins').forEach(o => o.classList.add('dim'));
      solve('4444', 'Caixa aberta!', 'O vulto sem crachá era o suspeito 04, “O Amarelo”. Lá dentro: o arquivo secreto.');
    });
  },

  /* ---------- 5. Arquivo secreto ---------- */
  () => {
    $('#app').innerHTML = roomShell(4, 'Quem é “O Amarelo”?', 'Arraste os pedaços rasgados para <b>completar o relatório</b>.', `
      <div class="report5"><h3>Identificação do acusado</h3>
        <div class="ln">Produto: Molho <span class="wslot drop" data-ans="MILHO"></span> e <span class="wslot drop" data-ans="MANTEIGA"></span></div>
        <div class="ln">Marca: <span class="wslot drop" data-ans="HEINZ"></span></div>
      </div>
      <div class="pieces">${['TOMATE', 'MILHO', 'AZEITE', 'HEINZ', 'MANTEIGA', 'ALHO'].map(w => `<div class="piece drag" data-id="${w}">${w}</div>`).join('')}</div>`, null);
    const root = $('#app'); let n = 0;
    enableDrag(root, '.piece', '.wslot', (el, slot) => {
      if (slot.classList.contains('filled')) return;
      if (slot.dataset.ans === el.dataset.id) {
        slot.innerHTML = ''; slot.appendChild(el); el.classList.add('placed'); slot.classList.add('filled'); SFX.ok();
        if (++n === 3) setTimeout(async () => {
          $('.report5').insertAdjacentHTML('beforeend', '<div class="closed">IDENTIFICADO</div>'); SFX.squish();
          S.busy = true; track('sala_concluida', { sala: 5, tempo: used() });
          await sleep(1100); finish();
        }, 300);
      } else { shake(el); shake(slot); penalize(); }
    });
  },
];

/* =========================================================
   INÍCIO E FIM
   ========================================================= */
function intro() {
  $('#hud').classList.add('hidden');
  $('#app').innerHTML = `<section class="screen intro fade"><div class="bg" style="background-image:var(--intro)"></div>
    <div><span class="sign">Arquivo Santa Mordida</span></div>
    <div class="tagline">3 vítimas · 1 culpado · <b>5 minutos</b></div>
    <div class="victims">
      <div class="who" data-b="bl"><div class="bob d1">${CH.pizza()}</div></div>
      <div class="who" id="introBurger"><div class="bob d2">${CH.burger()}</div></div>
      <div class="who" data-b="br"><div class="bob d3">${CH.fries()}</div></div>
    </div>
    <button class="btn pulse" id="startBtn">Começar investigação →</button>
    <div class="meta">Caso 001 · A última mordida</div></section>`;
  setTimeout(() => say($('#introBurger'), 'Socorro, detetive!', 4000), 600);
  $('#startBtn').onclick = () => { SFX.tap(); start(); };
}
function start() {
  Object.assign(S, { i: 0, start: Date.now(), pen: 0, errors: 0, timeUp: false, busy: false });
  $('#hud').classList.remove('hidden'); $('#timer').textContent = fmt(CONFIG.tempoLimiteSegundos);
  clearInterval(S.timerId); S.timerId = setInterval(tick, 1000);
  track('inicio'); showMap(0);
}
const SIL = `<svg class="sil" viewBox="0 0 120 220"><path d="M24 12Q60 2 96 12Q110 18 108 52Q106 86 96 104Q88 120 92 142Q96 166 86 176L34 176Q24 166 28 142Q32 120 24 104Q14 86 12 52Q10 18 24 12Z" fill="#0b0b0b" stroke="#f5c42c" stroke-width="4"/><rect x="36" y="178" width="48" height="30" rx="4" fill="#0b0b0b" stroke="#f5c42c" stroke-width="3"/><text x="60" y="118" text-anchor="middle" font-family="Oswald,Impact" font-weight="700" font-size="76" fill="#f2dfae">?</text></svg>`;
const DRIP = `<svg class="drip" viewBox="0 0 250 60" preserveAspectRatio="none"><path fill="#f5c42c" d="M0 0H250V8C238 8 236 30 228 30S220 10 206 10 196 44 186 44 178 12 160 12 150 24 142 24 134 9 118 9 108 52 98 52 88 11 70 11 62 28 54 28 44 9 30 9 22 38 14 38 8 8 0 8Z"/></svg>`;
function burst(win) {
  const kinds = ['k', 'k', 'k', 'b', 's'];
  for (let i = 0; i < 26; i++) {
    const p = document.createElement('span'); p.className = 'pt ' + kinds[i % kinds.length];
    const ang = Math.random() * Math.PI * 2, dist = 90 + Math.random() * 120;
    p.style.setProperty('--dx', Math.cos(ang) * dist + 'px'); p.style.setProperty('--dy', Math.sin(ang) * dist * .9 + 60 + 'px');
    p.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg'); p.style.animationDelay = Math.random() * .12 + 's';
    win.appendChild(p); setTimeout(() => p.remove(), 1600);
  }
}
async function finish() {
  clearInterval(S.timerId); S.i = ROOMS.length; dots(); closeModal();
  const t = used(), inTime = t <= CONFIG.tempoLimiteSegundos;
  track('caso_encerrado', { tempo: t, erros: S.errors, no_tempo: inTime });
  $('#app').innerHTML = `<section class="screen final fade" id="fin"><div class="bg" style="background-image:var(--spoon)"></div>
    <div class="stamp-big">Caso encerrado</div>
    <div class="fin">
      <div class="cell"><div class="win" id="win"><div class="rays"></div>${SIL}<img class="molho" src="${IMG.produto}" alt="Molho Milho e Manteiga Heinz">${DRIP}<div class="bars"><i></i><i></i><i></i><i></i><i></i></div></div>
        <div class="plate"><b>CELA Nº 1869</b><small>Culpado por acabar com o de sempre</small></div></div>
      <div class="fin-txt">
        <h2>Parabéns, detetive!</h2>
        <p>O culpado é o <b style="color:#fff">Molho Milho e Manteiga Heinz</b>. Agora cabe a você decidir o destino dele.</p>
        <div class="stats"><div><b>${fmt(t)}</b><small>${inTime ? 'Seu tempo' : 'Tempo (estourou)'}</small></div><div><b>${S.errors}</b><small>Erros</small></div></div>
        <div class="ctas"><a class="btn pulse" id="vBtn" href="${CONFIG.linkVeredito}" target="${CONFIG.abrirNaPaginaPrincipal ? '_top' : '_self'}">Dar meu veredito →</a><button class="btn ghost" id="again">Jogar de novo</button></div>
      </div>
    </div>
    <div class="cheer">
      <div class="who" data-b="bl"><div class="bob d1">${CH.pizza('happy')}</div></div>
      <div class="who" id="cb"><div class="bob d2">${CH.burger('happy')}</div></div>
      <div class="who" data-b="br"><div class="bob d3">${CH.fries('happy')}</div></div>
    </div></section>`;
  $('#again').onclick = () => { SFX.tap(); start(); };
  $('#vBtn').onclick = () => track('clique_veredito');
  const fin = $('#fin'), win = $('#win');
  window.scrollTo(0, 0);
  // 1) silhueta tremendo
  for (let i = 0; i < 6; i++) setTimeout(() => beep(90 + i * 25, .12, 'sawtooth', .03), i * 220);
  await sleep(1450);
  // 2) flash + revelação
  document.body.insertAdjacentHTML('beforeend', '<div class="flash"></div>'); setTimeout(() => $('.flash')?.remove(), 700);
  fin.classList.add('rev'); burst(win); SFX.win();
  await sleep(1000);
  // 3) grades descem
  fin.classList.add('jail'); setTimeout(() => { beep(70, .35, 'square', .08); beep(140, .2, 'sawtooth', .05, .02); }, 420);
  await sleep(800);
  // 4) texto
  fin.classList.add('done');
  setTimeout(() => say($('#cb'), 'Valeu, detetive!', 4000), 900);
}
$('#snd').onclick = () => { muted = !muted; $('#snd').textContent = muted ? '🔇' : '🔊'; };
intro();
</script>
</body>
